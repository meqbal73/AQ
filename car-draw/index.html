<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرعة السيارات 🚗</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:radial-gradient(circle at top,#1b2440,#0a0d18 70%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;text-align:center}
h1{font-size:30px;font-weight:900;margin-bottom:8px;background:linear-gradient(90deg,#ffd76a,#ff9f43);-webkit-background-clip:text;color:transparent}
.hi{font-size:22px;margin:18px 0 6px}
.hi b{color:#ffd76a}
.sub{color:#9aa4c4;font-size:15px}
.cars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0}
.car{background:#ffffff10;border:1px solid #ffd76a55;padding:7px 12px;border-radius:20px;font-size:14px}
.slot{height:84px;border-radius:16px;background:#0b1020;border:2px solid #ffd76a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;margin:22px 0;padding:0 10px}
.slot.win{border-color:#2ecc71;color:#7dffb2;box-shadow:0 0 30px #2ecc7155}
.btn{border:0;border-radius:14px;padding:16px 30px;font-family:inherit;font-size:20px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#ffd76a,#ff9f43);color:#1a1200;width:100%}
.btn:disabled{opacity:.5}
.big{font-size:64px;margin-top:10px}
.lock{color:#6f7899;font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="card" id="app"><h1>🚗 قرعة السيارات</h1><p class="sub">جاري التحميل...</p></div>
<script>
const SB_URL='https://yhgjrdvallnyvqkctspp.supabase.co', SB_KEY='sb_publishable_DIdaUajYtTDQh-hTThAkIg_4Fy7CoG_';
const token=new URLSearchParams(location.search).get('t')||'';
const app=document.getElementById('app');
async function rpc(fn,args){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function result(d){
  app.innerHTML='<h1>🚗 قرعة السيارات</h1><div class="big">🎉</div><p class="hi">يا <b>'+esc(d.name)+'</b> طلعت لك:</p><div class="slot win">'+esc(d.car||'—')+'</div>'
    +'<p class="lock">🔒 نتيجتك انحفظت وما تتغير</p>';
}
async function load(){
  if(!token){app.innerHTML='<h1>🚗 قرعة السيارات</h1><p class="sub">الرابط ناقص، اطلب رابطك الخاص</p>';return}
  try{
    const d=await rpc('qr_me',{p_token:token});
    if(!d.ok){app.innerHTML='<h1>🚗 قرعة السيارات</h1><p class="sub">الرابط غير صحيح ❌</p>';return}
    if(d.drawn) return result(d);
    window._cars=d.cars;
    app.innerHTML='<h1>🚗 قرعة السيارات</h1><p class="hi">هلا <b>'+esc(d.name)+'</b> 👋</p><p class="sub">عندك محاولة وحدة بس وما تتكرر</p>'
      +'<div class="cars">'+d.cars.map(c=>'<span class="car">🚘 '+esc(c)+'</span>').join('')+'</div>'
      +'<div class="slot" id="slot">❓</div><button class="btn" id="go">اسحب الحين 🎲</button>';
    document.getElementById('go').onclick=draw;
  }catch(e){app.innerHTML='<h1>🚗 قرعة السيارات</h1><p class="sub">صار خطأ في الاتصال، حدّث الصفحة</p>'}
}
async function draw(){
  const b=document.getElementById('go');b.disabled=true;b.textContent='جاري السحب...';
  const s=document.getElementById('slot'),opts=(window._cars||['🚗']);
  let res=null,err=false,t=0,d=60;
  rpc('qr_draw',{p_token:token}).then(r=>res=r).catch(()=>err=true);
  (function tick(){
    s.textContent=opts[t++%opts.length];d*=1.09;
    if(d<450||(!res&&!err))setTimeout(tick,Math.min(d,450));
    else if(err||!res.ok){s.textContent='خطأ، حدّث الصفحة';}
    else result(res);
  })();
}
load();
</script>
</body>
</html>
