<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>لوحة القرعة 🔐</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#0a0d18;color:#fff;min-height:100vh;padding:20px 14px 60px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:26px;font-weight:900;margin-bottom:4px;color:#ffd76a}
h2{font-size:19px;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}
.muted{color:#8790b0;font-size:13px}
.panel{background:#151b30;border:1px solid #ffffff14;border-radius:16px;padding:12px}
.row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #ffffff10;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.nm{flex:1;min-width:120px;font-weight:700;font-size:17px}
.res{font-size:14px;padding:4px 10px;border-radius:12px;background:#ffffff10;color:#9aa4c4}
.res.win{background:#1d4a35;color:#7dffb2}
.res.lose{background:#3a2430;color:#ff9fb0}
button{font-family:inherit;border:0;border-radius:10px;padding:8px 11px;font-size:14px;cursor:pointer;background:#ffffff14;color:#fff}
button:hover{background:#ffffff22}
.gold{background:linear-gradient(90deg,#ffd76a,#ff9f43);color:#1a1200;font-weight:700}
.wa{background:#1f8f4e}
.red{background:#5a1f2a}
.add{display:flex;gap:8px;margin-top:10px}
input{flex:1;font-family:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid #ffffff22;background:#0b1020;color:#fff}
.stats{display:flex;gap:10px;margin-top:14px}
.st{flex:1;background:#151b30;border-radius:14px;padding:12px;text-align:center}
.st b{display:block;font-size:24px;color:#ffd76a}
#login{max-width:340px;margin:80px auto;text-align:center}
#login input{width:100%;margin:16px 0 10px;text-align:center}
#login button{width:100%;padding:13px;font-size:17px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#04210f;padding:10px 18px;border-radius:12px;font-weight:700;display:none}
</style>
</head>
<body>
<div id="login">
  <h1>🔐 لوحة القرعة</h1>
  <p class="muted">هذي الصفحة لك أنت بس</p>
  <input id="key" type="password" placeholder="كلمة المرور">
  <button class="gold" onclick="login()">دخول</button>
  <p class="muted" id="lerr" style="color:#ff9fb0;margin-top:10px"></p>
</div>
<div class="wrap" id="main" style="display:none">
  <h1>🚗 لوحة القرعة</h1>
  <p class="muted">النتايج تظهر هنا بس — تتحدث تلقائيًا</p>
  <div class="stats" id="stats"></div>

  <h2>👥 الأشخاص <button onclick="copyAll()">نسخ كل الروابط</button></h2>
  <div class="panel" id="people"></div>
  <div class="add"><input id="np" placeholder="اسم شخص جديد"><button class="gold" onclick="addP()">إضافة</button></div>

  <h2>🚘 السيارات</h2>
  <div class="panel" id="cars"></div>
  <div class="add"><input id="nc" placeholder="سيارة جديدة"><button class="gold" onclick="addC()">إضافة</button></div>

  <h2>⚙️ خيارات</h2>
  <div class="panel"><div class="row"><span class="nm">إعادة القرعة للكل من جديد</span><button class="red" onclick="resetAll()">إعادة الكل</button></div>
  <div class="row"><span class="nm">تسجيل خروج</span><button onclick="logout()">خروج</button></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const SB_URL='https://yhgjrdvallnyvqkctspp.supabase.co', SB_KEY='sb_publishable_DIdaUajYtTDQh-hTThAkIg_4Fy7CoG_';
let KEY='';try{KEY=localStorage.getItem('qr_admin_key')||''}catch(e){}
let S={people:[],cars:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=location.href.replace(/admin\.html.*$/,'').replace(/[?#].*$/,'');
const link=p=>base+'?t='+p.token;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800)}
async function api(action,args={}){
  const r=await fetch(SB_URL+'/rest/v1/rpc/qr_admin',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_key:KEY,p_action:action,p_args:args})});
  const d=await r.json();
  if(!d.ok){if(d.error==='wrong_key'){logout();document.getElementById('lerr').textContent='كلمة المرور غلط'}throw 0}
  S=d;render();return d;
}
async function login(){KEY=document.getElementById('key').value.trim();try{await api('get');try{localStorage.setItem('qr_admin_key',KEY)}catch(e){};show()}catch(e){}}
function show(){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block'}
function logout(){KEY='';try{localStorage.removeItem('qr_admin_key')}catch(e){};document.getElementById('main').style.display='none';document.getElementById('login').style.display='block'}
function render(){
  const drawn=S.people.filter(p=>p.drawn).length, won=S.people.filter(p=>p.car).length;
  document.getElementById('stats').innerHTML='<div class="st"><b>'+S.people.length+'</b>أشخاص</div><div class="st"><b>'+drawn+'</b>سحبوا</div><div class="st"><b>'+(S.cars.length-won)+'</b>سيارات باقية</div>';
  document.getElementById('people').innerHTML=S.people.map(p=>{
    const r=p.drawn?(p.car?'<span class="res win">🎉 '+esc(p.car)+'</span>':'<span class="res lose">حظ أوفر</span>'):'<span class="res">ما سحب</span>';
    return '<div class="row"><span class="nm">'+esc(p.name)+'</span>'+r+
      '<button onclick="cp('+p.id+')">📋 الرابط</button><button class="wa" onclick="wa('+p.id+')">واتساب</button>'+
      '<button onclick="renP('+p.id+')">✏️</button>'+(p.drawn?'<button onclick="resetP('+p.id+')">↩️</button>':'')+
      '<button class="red" onclick="delP('+p.id+')">🗑</button></div>';
  }).join('')||'<p class="muted">ما فيه أحد</p>';
  document.getElementById('cars').innerHTML=S.cars.map(c=>'<div class="row"><span class="nm">🚘 '+esc(c.name)+'</span>'+
    (c.winner?'<span class="res win">'+esc(c.winner)+'</span>':'<span class="res">ما أحد أخذها</span>')+
    '<button onclick="renC('+c.id+')">✏️</button><button class="red" onclick="delC('+c.id+')">🗑</button></div>').join('')||'<p class="muted">ما فيه سيارات</p>';
}
const P=id=>S.people.find(p=>p.id===id), C=id=>S.cars.find(c=>c.id===id);
function cp(id){navigator.clipboard.writeText(link(P(id))).then(()=>toast('انتسخ رابط '+P(id).name))}
function wa(id){const p=P(id);window.open('https://wa.me/?text='+encodeURIComponent('هلا '+p.name+' 👋\nهذا رابطك لقرعة السيارات 🚗 (محاولة وحدة بس):\n'+link(p)))}
function copyAll(){navigator.clipboard.writeText(S.people.map(p=>p.name+': '+link(p)).join('\n')).then(()=>toast('انتسخت كل الروابط'))}
function addP(){const i=document.getElementById('np'),v=i.value.trim();if(v)api('add_person',{name:v}).then(()=>{i.value='';toast('انضاف')})}
function addC(){const i=document.getElementById('nc'),v=i.value.trim();if(v)api('add_car',{name:v}).then(()=>{i.value='';toast('انضافت')})}
function renP(id){const v=prompt('الاسم الجديد',P(id).name);if(v&&v.trim())api('rename_person',{id,name:v.trim()})}
function renC(id){const v=prompt('اسم السيارة',C(id).name);if(v&&v.trim())api('rename_car',{id,name:v.trim()})}
function delP(id){if(confirm('تحذف '+P(id).name+'؟ رابطه بيوقف'))api('delete_person',{id})}
function delC(id){if(confirm('تحذف '+C(id).name+'؟ لو أحد فايز فيها بيرجع له السحب'))api('delete_car',{id})}
function resetP(id){if(confirm('ترجع لـ '+P(id).name+' محاولته؟'))api('reset_person',{id})}
function resetAll(){if(confirm('متأكد؟ كل النتايج بتنمسح والكل يسحب من جديد'))api('reset_all')}
document.getElementById('key').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
document.getElementById('np').addEventListener('keydown',e=>{if(e.key==='Enter')addP()});
document.getElementById('nc').addEventListener('keydown',e=>{if(e.key==='Enter')addC()});
if(KEY)api('get').then(show).catch(()=>{});
setInterval(()=>{if(KEY&&document.getElementById('main').style.display!=='none'&&!document.hidden)api('get').catch(()=>{})},10000);
</script>
</body>
</html>
